openapi: 3.0.0
info:
  title: Helios Task Management API
  version: 2.0.0
  description: |
    Repaired contract for the Helios task completion endpoint.
    Fixes: unsafe HTTP method, leaked internal fields, missing version/deprecation path.

paths:
  /tasks/{id}/complete:
    patch:
      summary: Complete a task
      description: |
        Marks a task as completed. Uses PATCH because this mutates existing
        resource state (not safe, not cacheable) but is idempotent — repeating
        the same completion request does not change the outcome.
      operationId: completeTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The task ID to complete
        - name: X-API-Version
          in: header
          required: false
          schema:
            type: string
            enum: ['1.0', '2.0']
            default: '2.0'
          description: |
            Requested response version. '1.0' is deprecated: the response body
            is unchanged, but a `Deprecation: true` header is returned so
            legacy clients get a machine-readable migration signal instead of
            silently continuing to rely on a version slated for removal.
            Defaults to '2.0' when omitted.
      responses:
        '200':
          description: Task completed successfully
          headers:
            Deprecation:
              description: >
                Present and set to 'true' only when X-API-Version is '1.0'.
                Absent for '2.0' or when the header is omitted.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Public task ID
                  task_ref:
                    type: string
                  title:
                    type: string
                  assigned_user_id:
                    type: integer
                  project_id:
                    type: integer
                  completed_at:
                    type: string
                    format: date-time
              example:
                id: 42
                task_ref: TSK-2024-001
                title: Fix login form validation
                assigned_user_id: 7
                project_id: 12
                completed_at: '2024-05-19T14:32:00Z'
        '400':
          description: Task ID is missing or invalid
        '404':
          description: Task not found

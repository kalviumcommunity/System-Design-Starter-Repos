openapi: 3.0.0
info:
  title: Helios Task Management API
  version: 2.0.0
  description: |
    Repaired contract for the Helios task completion endpoint.
    Fixes: correct HTTP method, no internal field leakage, header-based
    versioning with a deprecation path for legacy clients.

paths:
  /tasks/{id}/complete:
    patch:
      summary: Complete a task
      description: |
        Marks a task as completed. Uses PATCH because this is a partial,
        state-changing update to an existing resource — not a safe,
        cacheable read.
      operationId: completeTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The task ID to complete
        - name: X-API-Version
          in: header
          required: false
          schema:
            type: string
            enum: ['1.0', '2.0']
            default: '2.0'
          description: >
            Requesting "1.0" returns the legacy response shape and marks
            the response Deprecation: true. "2.0" or omitted returns the
            current response shape with no deprecation flag.
      responses:
        '200':
          description: Task completed successfully
          headers:
            Deprecation:
              description: Present and set to "true" only when X-API-Version is "1.0"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Public task ID
                  task_ref:
                    type: string
                  title:
                    type: string
                  assigned_user_id:
                    type: integer
                  project_id:
                    type: integer
                  completed_at:
                    type: string
                    format: date-time
              example:
                id: 42
                task_ref: TSK-2024-001
                title: Fix login form validation
                assigned_user_id: 7
                project_id: 12
                completed_at: '2024-05-19T14:32:00Z'
        '400':
          description: Task ID is missing or invalid
        '404':
          description: Task not found
